services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: permissions
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d permissions']
      interval: 2s
      timeout: 5s
      retries: 15

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    # -js: enable JetStream (used for the KV cache), -m: monitoring endpoint for the healthcheck.
    command: ['-js', '-m', '8222']
    ports:
      - '4222:4222' # so you can talk to the service directly, e.g. with the `nats` CLI
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8222/healthz || exit 1']
      interval: 2s
      timeout: 5s
      retries: 15

  permissions:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/permissions/main.js']
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/permissions
      NATS_URL: nats://nats:4222
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: 300
      METRICS_PORT: 9464
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${TRACE_SAMPLE_RATIO:-1.0}
    # Replicas share a NATS queue group: each request is handled by exactly one of them.
    # Change with `docker compose up --scale permissions=4`; Prometheus discovers them all.
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  gateway:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/gateway/main.js']
    environment:
      PORT: 3000
      NATS_URL: nats://nats:4222
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Sample every request by default (nice for exploring Jaeger); lower it for load tests.
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${TRACE_SAMPLE_RATIO:-1.0}
    ports:
      - '3000:3000'
    depends_on:
      nats:
        condition: service_healthy

  # ---- Observability ----------------------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    restart: unless-stopped
    ports:
      - '16686:16686' # UI: http://localhost:16686

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=2d']
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090' # UI: http://localhost:9090

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/permissions-service.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000' # UI: http://localhost:3001 (admin / admin to edit)
    depends_on:
      - prometheus
      - jaeger

volumes:
  pgdata:
